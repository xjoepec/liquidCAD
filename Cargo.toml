[workspace]
resolver = "2"
members = [
    "crates/liquidcad-core",
    "crates/liquidcad-occt",
    "crates/liquidcad-dxf",
    "crates/liquidcad-mfg",
    "crates/liquidcad-store",
    "crates/liquidcad-engine",
    "crates/liquidcad-cli",
    "crates/liquidcad-protocol",
    "crates/liquidcad-sim",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/liquidcad/liquidcad"

[workspace.dependencies]
chrono = { version = "0.4", features = ["serde"] }
glam = { version = "0.29", features = ["serde"] }
indexmap = { version = "2", features = ["serde"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v4"] }

[profile.release]
lto = "thin"
codegen-units = 1
